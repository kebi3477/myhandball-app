name: myhandball
description: "마이핸드볼 - 핸드볼 경기 일정, 순위, 기록"
publish_to: 'none'

# 스토어 현재 버전은 1.1.0(빌드 3). Flutter 전환본은 빌드 4로 올린다.
version: 1.1.0+4

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 시안에서 추출한 로고/아이콘 SVG 렌더링
  flutter_svg: ^2.0.10

  # 상태 관리 (현재는 테마/온보딩 등 화면 상태만 사용)
  flutter_riverpod: ^2.5.1

  # API 연동 (myhandball-api). dart:io HttpClient 대신 쓰는 이유는
  # 웹/테스트에서도 같은 코드로 돌리고 MockClient를 끼울 수 있어서다.
  http: ^1.2.2

  # 기기 설정 영구 저장.
  shared_preferences: ^2.3.2

  # 익명 기기 ID(X-Device-Id)를 iOS Keychain에 둔다. **앱을 지웠다 깔아도
  # 남아야** 서버에 있는 예측·MVP·응원글이 다시 내 것이 된다.
  # lib/data/services/device_id_store.dart 참조
  flutter_secure_storage: ^10.3.4

  # 중계·예매 같은 외부 링크 열기
  url_launcher: ^6.3.1

  # 경기 일정을 .ics로 내보내 캘린더에 넣기
  share_plus: ^11.0.0

  # 마이팀 경기 푸시 (FCM). 설정 파일이 없으면 조용히 꺼진다 —
  # lib/data/services/push_service.dart 참조
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # 시안에서 추출한 SVG (logo, 성별 아이콘, 가이드 마스코트)
    - assets/design/
    # 디자인 프로젝트의 figassets/ 를 내보내 넣는 자리 — 없어도 앱은 뜬다
    - assets/figassets/

  fonts:
    # 시안 전역 font-family: Pretendard
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800

    # 시안이 스코어·등번호에 쓰는 Impact의 대체.
    # iOS/Android에 Impact가 없어 Pretendard로 떨어지면 훨씬 넓게 보인다.
    # Anton은 SIL OFL 1.1 (assets/fonts/Anton-OFL.txt).
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
